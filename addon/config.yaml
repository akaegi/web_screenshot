name: Web Screenshot
version: "0.0.4"
slug: web_screenshot
description: Renders element screenshots of a web page once into /media/screenshots (start it from an automation)
arch:
  - aarch64
  - amd64
init: false
startup: once
boot: manual
map:
  - media:rw
options:
  cdp_url: ""
  url: ""
  shots: []
  hide: []
  style: []
  width: 720
  height: 720
schema:
  cdp_url: password
  url: str
  shots:
    - selector: str
      output: str
  hide:
    - str
  style:
    - selector: str
      css: str
  width: int(100,)
  height: int(100,)
